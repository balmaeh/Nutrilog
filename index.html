<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NutriLog</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
<style>
:root{--bg:#F7F5F1;--card:#FFF;--border:#E8E3DB;--text:#1A1614;--muted:#7B766F;--green:#1B4D2E;--glt:#EBF5EE;--orange:#D4520C;--olt:#FEF0E7;--r:12px;--tbh:72px;--hdh:64px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}

/* App shell – flex column fills viewport. This avoids the iOS Safari bug
   where position:fixed scroll containers misfire click coordinates. */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);}

/* Header */
#hdr{flex-shrink:0;height:var(--hdh);padding:0 20px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--border);}
.hdr-date-sm{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.hdr-date-lg{font-size:17px;font-weight:700;line-height:1.2;}
.brand{font-size:20px;font-weight:800;letter-spacing:-.04em;color:var(--green);}
.brand span{color:var(--text);}

/* Main – flex:1 so it fills exactly the space between header and tabs */
#main{flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:16px 16px 24px;}

/* Tabs */
#tabs{flex-shrink:0;height:var(--tbh);background:var(--card);border-top:1.5px solid var(--border);display:flex;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:10px;font-family:'Outfit',sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;transition:color .15s;}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.tab.active{color:var(--green);}

/* Cards */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px;margin-bottom:12px;}
.sec{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;margin-top:4px;}

/* Kcal big display */
.kcal-hero{text-align:center;padding:20px 0 12px;}
.kcal-num{font-family:'DM Mono',monospace;font-size:52px;font-weight:500;line-height:1;transition:color .3s;}
.kcal-num.over{color:var(--orange);}
.kcal-sub{font-size:13px;color:var(--muted);margin-top:5px;}
.prog-wrap{margin-top:10px;}
.prog-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .4s ease;background:var(--green);}
.prog-fill.over{background:var(--orange);}
.macros-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.mc{text-align:center;}
.mc-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.mc-val{font-family:'DM Mono',monospace;font-size:17px;font-weight:500;margin-top:2px;}
.mc-tgt{font-size:10px;color:var(--muted);}

/* Log items */
.log-item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.log-item:last-child{border-bottom:none;}
.log-nfo{flex:1;min-width:0;}
.log-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.log-det{font-size:12px;color:var(--muted);margin-top:1px;}
.log-kcal{font-family:'DM Mono',monospace;font-size:14px;color:var(--muted);margin-right:10px;white-space:nowrap;}
.log-del{width:26px;height:26px;border-radius:50%;border:none;background:#F0EDE7;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:var(--muted);}

/* FAB */
#fab,#fab-cam{position:fixed;bottom:calc(var(--tbh) + 14px + env(safe-area-inset-bottom,0));width:50px;height:50px;border-radius:50%;border:none;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 4px 18px rgba(27,77,46,.35);display:flex;align-items:center;justify-content:center;z-index:90;transition:transform .15s,box-shadow .15s;}
#fab{right:20px;font-size:26px;}
#fab-cam{right:80px;}
#fab:active,#fab-cam:active{transform:scale(.93);box-shadow:0 2px 8px rgba(27,77,46,.3);}

/* Modal overlay + sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;}
.ov.open{opacity:1;pointer-events:all;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;z-index:201;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:93vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0);}
.sheet.open{transform:translateY(0);}
.sh-handle{width:36px;height:4px;background:#D0CBC1;border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.sh-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--border);}
.sh-title{font-size:17px;font-weight:600;}
.sh-close{border:none;background:none;font-size:26px;cursor:pointer;color:var(--muted);padding:0;line-height:1;}
.sh-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}

/* Segment */
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin:12px 20px;}
.seg-btn{flex:1;padding:7px;border:none;background:none;border-radius:6px;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;color:var(--muted);transition:all .15s;}
.seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}

/* Inputs */
.si{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;appearance:none;}
.si:focus{border-color:var(--green);}
.fg{padding:0 20px 14px;}
.fl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.grid4 .si,.grid4 input{padding:10px 8px;text-align:center;font-size:15px;}

/* Buttons */
.btn-p{display:block;width:calc(100% - 40px);margin:0 20px 14px;padding:14px;background:var(--green);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:opacity .15s;text-align:center;}
.btn-p:active{opacity:.85;}
.btn-s{display:block;width:calc(100% - 40px);margin:0 20px 12px;padding:12px;background:var(--bg);color:var(--green);border:1.5px solid var(--green);border-radius:12px;font-size:15px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;}

/* Food search list */
.sw{padding:0 20px 10px;}
.food-li{display:flex;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.food-li:active{background:#F7F5F1;}
.food-li:last-child{border-bottom:none;}
.fl-info{flex:1;min-width:0;}
.fl-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fl-meta{font-size:12px;color:var(--muted);margin-top:1px;}
.fl-kcal{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);flex-shrink:0;margin-right:6px;}

/* Menge screen */
.menge-screen{padding:20px;}
.mg-name{font-size:18px;font-weight:600;margin-bottom:3px;}
.mg-meta{font-size:13px;color:var(--muted);margin-bottom:20px;}
.mg-inp{width:100%;padding:16px;text-align:center;border:2px solid var(--green);border-radius:12px;font-size:28px;font-family:'DM Mono',monospace;font-weight:500;background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;appearance:none;}
.mg-preview{text-align:center;font-size:14px;color:var(--muted);margin:10px 0 22px;}
.mg-live{margin:12px 0 22px;}
.mg-live-macros{display:flex;justify-content:center;gap:22px;}
.mg-live-mac{display:flex;flex-direction:column;align-items:center;gap:2px;}
.mg-live-mac .mv{font-size:15px;font-weight:600;font-family:'DM Mono',monospace;color:var(--text);}
.mg-live-mac .ml{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.mg-back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;margin-bottom:16px;background:none;border:none;font-family:'Outfit',sans-serif;padding:0;}

/* Barcode / manual */
.bc-row{display:flex;gap:8px;padding:0 20px 10px;}
.bc-inp{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;appearance:none;}
.bc-inp:focus{border-color:var(--green);}
.bc-btn{padding:11px 16px;border:none;border-radius:10px;background:var(--green);color:#fff;font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;white-space:nowrap;}
.bc-camera{position:relative;margin:0 20px 12px;border:1.5px solid var(--border);border-radius:16px;overflow:hidden;background:#000;min-height:180px;display:none;max-width:calc(100vw - 40px);box-sizing:border-box;}
.bc-camera.open{display:block;}
.bc-camera video{width:100%;height:auto;display:block;}
.bc-close{position:absolute;top:12px;right:12px;border:none;background:rgba(0,0,0,.5);color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cam-torch{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:none;background:rgba(0,0,0,.5);color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s;}
.cam-torch.on{background:rgba(255,200,50,.85);color:#000;}
.cam-hint{position:absolute;bottom:12px;left:12px;padding:6px 10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:999px;}
.status{padding:0 20px 10px;font-size:13px;color:var(--muted);}
.status.ok{color:var(--green);}
.status.err{color:var(--orange);}

/* Verlauf */
.chart-box{height:190px;position:relative;padding:4px 0;}
.hist-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.hist-row:last-child{border-bottom:none;}
.hist-dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:10px;flex-shrink:0;}
.hist-dot.over{background:var(--orange);}
.hist-date{font-size:12px;color:var(--muted);width:72px;flex-shrink:0;}
.hist-kcal{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;flex:1;}
.hist-kcal.over{color:var(--orange);}
.hist-mac{font-size:11px;color:var(--muted);text-align:right;}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.scard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.scard-v{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;}
.scard-l{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}

/* Database */
.kat-bar{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.kat-bar::-webkit-scrollbar{display:none;}
.kchip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;font-weight:600;background:var(--card);white-space:nowrap;cursor:pointer;font-family:'Outfit',sans-serif;color:var(--muted);transition:all .15s;flex-shrink:0;}
.kchip.active{background:var(--green);color:#fff;border-color:var(--green);}
.db-item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
.db-item:last-child{border-bottom:none;}
.db-nfo{flex:1;min-width:0;}
.db-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.db-meta{font-size:12px;color:var(--muted);margin-top:1px;}
.db-kcal{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);margin-right:8px;flex-shrink:0;}
.db-del{width:26px;height:26px;border-radius:50%;border:none;background:#F0EDE7;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:var(--muted);}

/* Settings */
.set-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);}
.set-lbl{flex:1;font-size:15px;font-weight:500;}
.set-inp{width:82px;padding:7px 10px;text-align:right;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);outline:none;-webkit-appearance:none;appearance:none;}
.set-inp:focus{border-color:var(--green);}
.set-btn{padding:10px 14px;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;}

/* Misc */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.badge{display:inline-block;padding:2px 7px;border-radius:12px;font-size:11px;font-weight:600;}
.bg-kat{background:#F0EDE7;color:var(--muted);}
.bg-green{background:var(--glt);color:var(--green);}
</style>
</head>
<body>

<div id="app">
<div id="hdr">
  <div>
    <div class="hdr-date-sm" id="hdr-wd"></div>
    <div class="hdr-date-lg" id="hdr-d"></div>
  </div>
  <div class="brand">NUTRI<span>LOG</span></div>
</div>

<div id="main"></div>

<nav id="tabs">
  <button class="tab active" data-t="erfassen" onclick="switchTab('erfassen')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>Erfassen
  </button>
  <button class="tab" data-t="verlauf" onclick="switchTab('verlauf')">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Verlauf
  </button>
  <button class="tab" data-t="db" onclick="switchTab('db')">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4.03 3-9 3S3 13.66 3 12"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/></svg>Datenbank
  </button>
  <button class="tab" data-t="cfg" onclick="switchTab('cfg')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Einstellungen
  </button>
</nav>
</div><!-- #app -->

<button id="fab-cam" onclick="openAddCamera()" style="display:none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
<button id="fab" onclick="openAdd()">+</button>

<!-- Add Entry Sheet -->
<div class="ov" id="add-ov" onclick="closeAdd()"></div>
<div class="sheet" id="add-sh">
  <div class="sh-handle"></div>
  <div class="sh-hdr">
    <span class="sh-title" id="add-title">Hinzufügen</span>
    <button class="sh-close" onclick="closeAdd()">×</button>
  </div>
  <div class="seg">
    <button class="seg-btn active" id="seg-db" onclick="switchAddMode('db')">Aus Datenbank</button>
    <button class="seg-btn" id="seg-bc" onclick="switchAddMode('bc')">Barcode / Manuell</button>
  </div>
  <div class="sh-body" id="add-body"></div>
</div>

<!-- Edit Food Sheet -->
<div class="ov" id="ef-ov" onclick="closeEdit()"></div>
<div class="sheet" id="ef-sh">
  <div class="sh-handle"></div>
  <div class="sh-hdr">
    <span class="sh-title" id="ef-title">Lebensmittel</span>
    <button class="sh-close" onclick="closeEdit()">×</button>
  </div>
  <div class="sh-body" id="ef-body"></div>
</div>

<script>
// ===================== POCKETBASE =====================
const PB_URL='http://192.168.1.118:8090';
const pb=new PocketBase(PB_URL);

// ===================== STATE =====================
let S = {
  foods: [],
  days: {},
  history: {},
  settings: { ziel: 2000, bedarf: 2135 },
  activeTab: 'erfassen',
  today: todayISO(),
  _settingsPbId: null,
  _customKatsPbIds: {},
};
let activeDay=todayISO();
let addMode='db', addFood=null, addListKat='Alle', addSearch='';
let dbKat='Alle', dbSearch='';
let chartInst=null;
let editFood=null;
let cameraStream=null;
let torchOn=false;
let cameraScanTimer=null;
let barcodeDetector=null;
let zxingReader=null;
let barcodeCandidate=null;
let barcodeCandidateCount=0;
const BARCODE_CONFIRM=1;
let verlaufFrom='';
let verlaufTo='';
let verlaufAgg='day';
let verlaufShow={kcal:true,protein:false,fett:false,kh:false};
let verlaufTableOpen=false;

function todayISO(){return new Date().toISOString().slice(0,10);}

async function save(){
  if(!S._settingsPbId) return;
  try{
    await pb.collection('settings').update(S._settingsPbId,{
      ziel:S.settings.ziel,
      bedarf:S.settings.bedarf,
      zielProtein:S.settings.zielProtein||0,
    });
  }catch(e){console.error('Einstellungen-Fehler:',e);}
}
async function load(){
  S.today=todayISO();
  activeDay=S.today;
  try{
    const [foodsRecs,mealsRecs,histRecs,daysRecs,settRecs,katRecs]=await Promise.all([
      pb.collection('foods').getFullList({sort:'+created'}),
      pb.collection('meals').getFullList({sort:'+created'}),
      pb.collection('history').getFullList(),
      pb.collection('days').getFullList(),
      pb.collection('settings').getFullList(),
      pb.collection('custom_kats').getFullList(),
    ]);

    S.foods=foodsRecs.map(r=>({
      id:r.id,kat:r.kat||'',name:r.name||'',quelle:r.quelle||'',
      einheit:r.einheit||'Stück',gew:r.gew||100,
      k:r.k||0,f:r.f||0,c:r.c||0,p:r.p||0,
    }));

    mealsRecs.forEach(rec=>{
      const date=rec.date||null;
      if(!date) return;
      if(!S.days[date]) S.days[date]={items:[],ziel:null,gewicht:null,_daysPbId:null};
      S.days[date].items.push({
        _pbId:rec.id,name:rec.name||'',menge:rec.menge||1,
        einheit:rec.einheit||'Stück',kcal:rec.kcal||0,
        fett:rec.fett||0,kh:rec.kh||0,protein:rec.protein||0,
      });
    });

    S.history={};
    histRecs.forEach(rec=>{
      S.history[rec.date]={_pbId:rec.id,kcal:rec.kcal||0,fett:rec.fett||0,kh:rec.kh||0,protein:rec.protein||0};
    });

    daysRecs.forEach(rec=>{
      if(!S.days[rec.date]) S.days[rec.date]={items:[],ziel:null,gewicht:null};
      S.days[rec.date].ziel=rec.ziel||null;
      S.days[rec.date].gewicht=rec.gewicht||null;
      S.days[rec.date]._daysPbId=rec.id;
    });

    if(settRecs.length>0){
      const r=settRecs[0];
      S.settings={ziel:r.ziel||2000,bedarf:r.bedarf||2135,zielProtein:r.zielProtein||0};
      S._settingsPbId=r.id;
    }else{
      const defProt=Math.round(2135*0.25/4);
      const r=await pb.collection('settings').create({ziel:2000,bedarf:2135,zielProtein:defProt});
      S.settings={ziel:2000,bedarf:2135,zielProtein:defProt};
      S._settingsPbId=r.id;
    }

    S.customKats=katRecs.map(r=>r.name);
    S._customKatsPbIds={};
    katRecs.forEach(r=>{S._customKatsPbIds[r.name]=r.id;});

  }catch(e){
    console.error('PocketBase nicht erreichbar – ist der Server unter',PB_URL,'online?',e);
  }

  if(!S.settings.zielProtein) S.settings.zielProtein=Math.round((S.settings.bedarf||2135)*0.25/4);
  if(S.activeTab==='heute') S.activeTab='erfassen';
  S.foods.forEach(f=>{if(f.einheit==='Dose') f.einheit='Packung';});
}

// ===================== HELPERS =====================
function calcNutr(food, menge){
  const mult=(food.gew*menge)/100;
  return {kcal:Math.round(food.k*mult*10)/10,fett:Math.round(food.f*mult*10)/10,kh:Math.round(food.c*mult*10)/10,protein:Math.round(food.p*mult*10)/10};
}
function perUnit(food){return calcNutr(food,1);}
function getTotals(date){
  const day=S.days[date];
  if(day&&day.items&&day.items.length){
    return day.items.reduce((a,i)=>({kcal:a.kcal+i.kcal,fett:a.fett+i.fett,kh:a.kh+i.kh,protein:a.protein+i.protein}),{kcal:0,fett:0,kh:0,protein:0});
  }
  return S.history[date]||null;
}
function fmtDE(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-');
  const months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  return `${parseInt(d)}. ${months[parseInt(m)-1]}`;
}
function fmtDELong(iso){
  const days=['So','Mo','Di','Mi','Do','Fr','Sa'];
  const d=new Date(iso);
  return `${days[d.getDay()]}, ${fmtDE(iso)}`;
}
function pct(val,max){return Math.min(100,Math.round(val/max*100));}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function r1(n){return Math.round(n*10)/10;}
async function saveDayMeta(date){
  const day=S.days[date];
  const data={date,ziel:day?.ziel||null,gewicht:day?.gewicht||null};
  try{
    if(day?._daysPbId){
      await pb.collection('days').update(day._daysPbId,data);
    }else{
      const rec=await pb.collection('days').create(data);
      if(!S.days[date]) S.days[date]={items:[],ziel:null,gewicht:null};
      S.days[date]._daysPbId=rec.id;
    }
  }catch(e){console.error('Day-Meta-Fehler:',e);}
}

  }
}

function editDayWeight(ev,d){
  const span=ev.currentTarget;
  const current=S.days[d]?.gewicht||'';
  const inp=document.createElement('input');
  inp.type='number';inp.step='0.1';inp.value=current;inp.placeholder='kg';
  inp.style='width:58px;font-size:13px;padding:2px 5px;border:1.5px solid rgba(100,149,237,.8);border-radius:4px;font-family:"DM Mono",monospace;outline:none;color:rgba(100,149,237,.9);background:var(--bg,#F7F5F1);';
  inp.onblur=()=>{
    if(!S.days[d]) S.days[d]={items:[]};
    const g=parseFloat(inp.value);
    if(g>0) S.days[d].gewicht=g; else S.days[d].gewicht=null;
    saveDayMeta(d);render();
  };
  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();if(e.key==='Escape')render();};
  span.replaceWith(inp);
  inp.focus();inp.select();
}

async function saveHistoryEdit(d){
  const data={
    kcal:parseFloat(document.getElementById('he-kcal')?.value)||0,
    fett:parseFloat(document.getElementById('he-fett')?.value)||0,
    kh:parseFloat(document.getElementById('he-kh')?.value)||0,

  };

    if(pbId){
      await pb.collection('history').update(pbId,data);
      S.history[d]={...data,_pbId:pbId};

      const rec=await pb.collection('history').create({date:d,...data});
      S.history[d]={...data,_pbId:rec.id};
    }
  }catch(e){console.error('History-Fehler:',e);}

function getAllDays(){
  const merged={};
  Object.assign(merged,S.history);
  Object.entries(S.days).forEach(([d,day])=>{
    if(day.items&&day.items.length){
      const t=day.items.reduce((a,i)=>({kcal:a.kcal+i.kcal,fett:a.fett+i.fett,kh:a.kh+i.kh,protein:a.protein+i.protein}),{kcal:0,fett:0,kh:0,protein:0});
      merged[d]=t;
    }
  });
  return merged;
}

function isoWeek(iso){
  const d=new Date(iso+'T12:00:00');
  const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day+3);
  const yearStart=new Date(d.getFullYear(),0,1);
  const wn=Math.ceil(((d-yearStart)/864e5+1)/7);
  return `${d.getFullYear()}-${String(wn).padStart(2,'0')}`;
}

function drawChart(){
  const canvas=document.getElementById('kcal-chart');
  if(!canvas) return;
  if(chartInst){chartInst.destroy();chartInst=null;}
  const allDays=getAllDays();
  const sortedAll=Object.keys(allDays).sort();
  const defaultFrom=new Date(new Date(S.today)-60*864e5).toISOString().slice(0,10);
  const from=verlaufFrom||defaultFrom;
  const to=verlaufTo||S.today;
  const weights=getAllWeights();
  const foodDates=sortedAll.filter(d=>d>=from&&d<=to);
  let labels=[],data=[],proteinData=[],fettData=[],khData=[],weightData=[];
  if(verlaufAgg==='week'){
    const filtered=foodDates.map(d=>({date:d,...allDays[d]}));
    const weeks={};
    filtered.forEach(({date,kcal,protein,fett,kh})=>{
      const wk=isoWeek(date);
      if(!weeks[wk])weeks[wk]={kcal:0,protein:0,fett:0,kh:0,nKcal:0,nProtein:0,nFett:0,nKh:0};
      if(kcal>0){weeks[wk].kcal+=kcal;weeks[wk].nKcal++;}
      if(protein>0){weeks[wk].protein+=protein;weeks[wk].nProtein++;}
      if(fett>0){weeks[wk].fett+=fett;weeks[wk].nFett++;}
      if(kh>0){weeks[wk].kh+=kh;weeks[wk].nKh++;}
    });
    Object.keys(weeks).sort().forEach(wk=>{
      const[y,w]=wk.split('-');const b=weeks[wk];
      labels.push('KW'+w+' \''+y.slice(2));
      data.push(b.nKcal?Math.round(b.kcal/b.nKcal):null);
      proteinData.push(b.nProtein?Math.round(b.protein/b.nProtein):null);
      fettData.push(b.nFett?Math.round(b.fett/b.nFett):null);
      khData.push(b.nKh?Math.round(b.kh/b.nKh):null);
    });
  } else if(verlaufAgg==='month'){
    const filtered=foodDates.map(d=>({date:d,...allDays[d]}));
    const months={};
    filtered.forEach(({date,kcal,protein,fett,kh})=>{
      const mo=date.slice(0,7);
      if(!months[mo])months[mo]={kcal:0,protein:0,fett:0,kh:0,nKcal:0,nProtein:0,nFett:0,nKh:0};
      if(kcal>0){months[mo].kcal+=kcal;months[mo].nKcal++;}
      if(protein>0){months[mo].protein+=protein;months[mo].nProtein++;}
      if(fett>0){months[mo].fett+=fett;months[mo].nFett++;}
      if(kh>0){months[mo].kh+=kh;months[mo].nKh++;}
    });
    const mn=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
    Object.keys(months).sort().forEach(mo=>{
      const[y,m]=mo.split('-');const b=months[mo];
      labels.push(mn[parseInt(m)-1]+' \''+y.slice(2));
      data.push(b.nKcal?Math.round(b.kcal/b.nKcal):null);
      proteinData.push(b.nProtein?Math.round(b.protein/b.nProtein):null);
      fettData.push(b.nFett?Math.round(b.fett/b.nFett):null);
      khData.push(b.nKh?Math.round(b.kh/b.nKh):null);
    });
  } else {
    const wtDates=Object.keys(weights).filter(d=>d>=from&&d<=to);
    const unionDates=[...new Set([...foodDates,...wtDates])].sort();
    labels=unionDates.map(d=>fmtDE(d));
    data=unionDates.map(d=>allDays[d]?Math.round(allDays[d].kcal):null);
    proteinData=unionDates.map(d=>allDays[d]?Math.round(allDays[d].protein):null);
    fettData=unionDates.map(d=>allDays[d]?Math.round(allDays[d].fett):null);
    khData=unionDates.map(d=>allDays[d]?Math.round(allDays[d].kh):null);
    weightData=unionDates.map(d=>weights[d]??null);
  }
  const {ziel,bedarf}=S.settings;
  const hasWeight=weightData.some(v=>v!==null);
  // determine if any macro line is shown (→ show y2 axis)
  const hasMacro=verlaufShow.protein||verlaufShow.fett||verlaufShow.kh;
  const showY2=hasWeight||hasMacro;
  const datasets=[];
  if(verlaufShow.kcal){
    datasets.push({label:'kcal',data,backgroundColor:data.map(v=>v!=null&&v>ziel?'rgba(212,82,12,.65)':'rgba(27,77,46,.6)'),borderRadius:3,borderSkipped:false,yAxisID:'y'});

  }

  try{
    chartInst=new Chart(canvas,{
      type:'bar',
      data:{labels,datasets},

          y2:{display:showY2,position:'right',ticks:{font:{size:9},color:'rgba(100,149,237,.9)'},grid:{display:false}}
        }
      }
    });

}

function getCategories(){
  return [...new Set(S.foods.map(f=>f.kat))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'de'));
}
async function renameKat(oldName){
  const neu=prompt('Kategorie umbenennen:',oldName);
  if(!neu||neu.trim()===oldName) return;
  const trimmed=neu.trim();
  const toUpdate=S.foods.filter(f=>f.kat===oldName);
  toUpdate.forEach(f=>{f.kat=trimmed;});
  try{
    await Promise.all(toUpdate.map(f=>pb.collection('foods').update(f.id,{kat:trimmed})));
    if(S._customKatsPbIds?.[oldName]){
      await pb.collection('custom_kats').update(S._customKatsPbIds[oldName],{name:trimmed});
      S._customKatsPbIds[trimmed]=S._customKatsPbIds[oldName];
      delete S._customKatsPbIds[oldName];
      const i=S.customKats.indexOf(oldName);
      if(i>=0) S.customKats[i]=trimmed;
    }
  }catch(e){console.error('Umbenennen-Fehler:',e);}
  render();
}
async function deleteKat(name){
  const count=S.foods.filter(f=>f.kat===name).length;
  const msg=count>0
    ?`Kategorie „${name}" löschen?\n${count} Produkt(e) werden auf „Sonstiges" gesetzt.`
    :`Kategorie „${name}" löschen?`;
  if(!confirm(msg)) return;
  const toUpdate=S.foods.filter(f=>f.kat===name);
  toUpdate.forEach(f=>{f.kat='Sonstiges';});
  try{
    await Promise.all(toUpdate.map(f=>pb.collection('foods').update(f.id,{kat:'Sonstiges'})));
    if(S._customKatsPbIds?.[name]){
      await pb.collection('custom_kats').delete(S._customKatsPbIds[name]);
      delete S._customKatsPbIds[name];
      S.customKats=S.customKats.filter(k=>k!==name);
    }
  }catch(e){console.error('Kategorie-Lösch-Fehler:',e);}
  render();
}
async function addKat(){
  const inp=document.getElementById('new-kat-inp');
  const name=inp?.value?.trim();
  if(!name) return;
  if(!S.customKats) S.customKats=[];
  if(!S._customKatsPbIds) S._customKatsPbIds={};
  if(!S.customKats.includes(name)){
    S.customKats.push(name);
    try{
      const rec=await pb.collection('custom_kats').create({name});
      S._customKatsPbIds[name]=rec.id;
    }catch(e){console.error('Kategorie-Fehler:',e);}
  }
  if(inp) inp.value='';
  render();
}

function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async e=>{
    const file=e.target.files[0];
    if(!file) return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      let count=0;
      if(data.foods&&Array.isArray(data.foods)){
        for(const f of data.foods){
          if(!S.foods.find(x=>x.name===f.name&&x.kat===f.kat)){
            const{id:_,...fd}=f;
            try{const rec=await pb.collection('foods').create(fd);S.foods.push({...fd,id:rec.id});count++;}catch(e){}
          }
        }
      }
      if(data.days&&typeof data.days==='object'){
        for(const [date,day] of Object.entries(data.days)){
          if(day.items?.length){
            for(const item of day.items){
              try{
                const rec=await pb.collection('meals').create({...item,date});
                if(!S.days[date]) S.days[date]={items:[],ziel:null,gewicht:null};
                S.days[date].items.push({...item,_pbId:rec.id});count++;
              }catch(e){}
            }
          }
        }
      }
      if(data.settings&&typeof data.settings==='object'){
        Object.assign(S.settings,data.settings);
        await save();
      }
      render();
      alert(`Import erfolgreich! ${count} Einträge hinzugefügt.`);
    }catch(err){alert('Import fehlgeschlagen: '+err.message);}
  };
  inp.click();
}

function exportCSV(){
  const allDays=getAllDays();
  const sorted=Object.keys(allDays).sort();
  let csv='Datum,kcal,Fett (g),Kohlenhydrate (g),Protein (g)\n';
  sorted.forEach(d=>{const v=allDays[d];csv+=`${d},${r1(v.kcal)},${r1(v.fett)},${r1(v.kh)},${r1(v.protein)}\n`;});
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='nutrilog_verlauf.csv';a.click();URL.revokeObjectURL(url);
}

function exportPDF(){
  const jsPDF=window.jspdf?.jsPDF;
  if(!jsPDF){alert('jsPDF nicht verfügbar.');return;}
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  let y=20;
  doc.setFont('helvetica','bold');doc.setFontSize(18);
  doc.text('NutriLog Verlauf',20,y);y+=8;
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  const allDays=getAllDays();
  const sortedAll=Object.keys(allDays).sort();
  const defaultFrom=new Date(new Date(S.today)-60*864e5).toISOString().slice(0,10);
  const from=verlaufFrom||defaultFrom;
  const to=verlaufTo||S.today;
  doc.text(`Zeitraum: ${from} – ${to}  |  Erstellt: ${new Date().toLocaleDateString('de-CH')}`,20,y);y+=8;
  const chartCanvas=document.getElementById('kcal-chart');
  if(chartCanvas&&chartInst){
    try{doc.addImage(chartCanvas.toDataURL('image/png'),'PNG',20,y,170,70);y+=75;}catch(e){}
  }
  const filtered=sortedAll.filter(d=>d>=from&&d<=to).map(d=>allDays[d]);
  if(filtered.length){
    const avg=Math.round(filtered.reduce((a,v)=>a+v.kcal,0)/filtered.length);
    const avgP=Math.round(filtered.reduce((a,v)=>a+v.protein,0)/filtered.length);
    const avgF=Math.round(filtered.reduce((a,v)=>a+v.fett,0)/filtered.length);
    const avgC=Math.round(filtered.reduce((a,v)=>a+v.kh,0)/filtered.length);
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('Durchschnittswerte',20,y);y+=5;
    doc.setFont('helvetica','normal');doc.setFontSize(10);
    doc.text(`Ø ${avg} kcal  |  Protein: ${avgP}g  |  Fett: ${avgF}g  |  KH: ${avgC}g  |  ${filtered.length} Tage`,20,y);y+=8;
  }
  doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Datum',20,y);doc.text('kcal',82,y);doc.text('Fett g',105,y);doc.text('KH g',128,y);doc.text('Protein g',151,y);
  y+=2;doc.setDrawColor(180);doc.line(20,y,190,y);y+=3;
  doc.setFont('helvetica','normal');
  sortedAll.filter(d=>d>=from&&d<=to).reverse().forEach(d=>{
    if(y>280){doc.addPage();y=20;}
    const v=allDays[d];
    doc.text(fmtDELong(d),20,y);doc.text(String(Math.round(v.kcal)),82,y);
    doc.text(String(Math.round(v.fett)),105,y);doc.text(String(Math.round(v.kh)),128,y);
    doc.text(String(Math.round(v.protein)),151,y);y+=4.5;
  });
  doc.save('nutrilog_verlauf.pdf');
}

function exportData(){
  const blob=new Blob([JSON.stringify({days:S.days,foods:S.foods,settings:S.settings},null,2)],{type:'application/json'});

function onEinheitChange(){

  if(anzahlLbl) anzahlLbl.textContent=isVol?(ein==='Gramm'?'Gramm':'ml'):'Anzahl';

function updateBCPreview(){

  const isVol=(ein==='Gramm'||ein==='Milliliter');
  const anzahl=parseFloat(document.getElementById('bc-anzahl')?.value)||(isVol?100:1);
  const gew=isVol?1:(parseFloat(document.getElementById('bc-gew')?.value)||100);

function setBarcodeStatus(msg, level=''){
  const st=document.getElementById('bc-status');
  if(!st) return;
  st.className='status';
  if(level) st.classList.add(level);
  st.textContent=msg;
}

function showBarcodeCamera(open){
  const cam=document.getElementById('bc-camera');
  if(!cam) return;
  cam.hidden=!open;
  cam.classList.toggle('open', open);
}

function normalizeBarcode(raw){
  return typeof raw==='string' ? raw.replace(/\D/g,'') : '';
}

function isValidBarcode(code){
  if(!code || !/^[0-9]+$/.test(code)) return false;
  if(code.length!==8 && code.length!==12 && code.length!==13) return false;
  const digits=code.split('').map(Number);
  const check=digits.pop();
  let sum=0;
  for(let i=digits.length-1, pos=0; i>=0; i--, pos++){
    sum+=digits[i]*((pos%2===0)?3:1);
  }
  return ((10-(sum%10))%10)===check;
}

function onBarcodeRead(rawValue){
  const code=normalizeBarcode(rawValue);
  if(!isValidBarcode(code)) return;
  if(code===barcodeCandidate){
    barcodeCandidateCount++;
  } else {
    barcodeCandidate=code;
    barcodeCandidateCount=1;
  }
  if(barcodeCandidateCount>=BARCODE_CONFIRM){
    stopBarcodeCamera();
    const inp=document.getElementById('bc-inp');
    if(inp) inp.value=code;
    lookupBarcode();
  }
}

function stopBarcodeCamera(){
  if(cameraScanTimer){clearInterval(cameraScanTimer);cameraScanTimer=null;}
  if(zxingReader){try{zxingReader.reset();}catch(e){} zxingReader=null;}
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
  torchOn=false;
  barcodeCandidate=null;
  barcodeCandidateCount=0;
  const video=document.getElementById('bc-video');
  if(video){video.srcObject=null;}
  showBarcodeCamera(false);
}

async function toggleTorch(){
  const video=document.getElementById('bc-video');
  const stream=cameraStream||(video?.srcObject);
  if(!stream) return;
  const track=stream.getVideoTracks()[0];
  if(!track) return;
  torchOn=!torchOn;
  try{
    await track.applyConstraints({advanced:[{torch:torchOn}]});
    const btn=document.getElementById('cam-torch-btn');
    if(btn) btn.classList.toggle('on',torchOn);
  }catch(e){
    torchOn=false;
    setBarcodeStatus('Licht nicht verfügbar.','err');
  }
}

async function startWithZXing(){
  if(!window.ZXing){
    setBarcodeStatus('Barcode-Scanner nicht verfügbar.','err');
    showBarcodeCamera(false);
    return;
  }
  try{
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,
    ]);
    zxingReader=new ZXing.BrowserMultiFormatReader(hints,250);
    const video=document.getElementById('bc-video');
    setBarcodeStatus('Barcode ins Bild halten…','ok');
    await zxingReader.decodeFromVideoDevice(null, video, (result, err)=>{
      if(!cameraStream&&video.srcObject) cameraStream=video.srcObject;
      if(result) onBarcodeRead(result.getText());
    });
  }catch(e){
    setBarcodeStatus('Kamera konnte nicht gestartet werden.','err');
    showBarcodeCamera(false);
    if(zxingReader){try{zxingReader.reset();}catch(e){} zxingReader=null;}
  }
}

async function startBarcodeCamera(){
  stopBarcodeCamera();
  if(!navigator.mediaDevices?.getUserMedia){
    setBarcodeStatus('Kamera nicht verfügbar.','err');
    return;
  }
  showBarcodeCamera(true);
  setBarcodeStatus('Kamera öffnet…');
  if('BarcodeDetector' in window){
    try{
      const allFormats=await BarcodeDetector.getSupportedFormats();
      const formats=allFormats.filter(f=>['ean_8','ean_13','upc_a','upc_e'].includes(f));
      if(!formats.length) throw new Error('no formats');
      if(!barcodeDetector) barcodeDetector=new BarcodeDetector({formats});
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      cameraStream=stream;
      const video=document.getElementById('bc-video');
      video.srcObject=stream;
      await video.play();
      setBarcodeStatus('Barcode ins Bild halten…','ok');
      cameraScanTimer=setInterval(async()=>{
        if(video.paused||video.readyState<2) return;
        try{
          const codes=await barcodeDetector.detect(video);
          if(codes.length) onBarcodeRead(codes[0].rawValue);
        }catch(e){}
      },250);
    }catch(e){
      stopBarcodeCamera();
      showBarcodeCamera(true);
      setBarcodeStatus('Kamera öffnet…');
      await startWithZXing();
    }
  } else {
    await startWithZXing();
  }
}

async function addManual(saveDB){
  const name=document.getElementById('bc-name')?.value?.trim()||'Unbekannt';
  const k=parseFloat(document.getElementById('bc-k')?.value)||0;
  const f=parseFloat(document.getElementById('bc-f')?.value)||0;
  const c=parseFloat(document.getElementById('bc-c')?.value)||0;
  const p=parseFloat(document.getElementById('bc-p')?.value)||0;
  const ein=document.getElementById('bc-ein')?.value||'Stück';
  const isVol=(ein==='Gramm'||ein==='Milliliter');
  const anzahl=parseFloat(document.getElementById('bc-anzahl')?.value)||(isVol?100:1);
  const gew=isVol?1:(parseFloat(document.getElementById('bc-gew')?.value)||100);
  let kcal,fett,kh,protein;
  if(isVol){
    const mult=anzahl/100;
    kcal=r1(k*mult);fett=r1(f*mult);kh=r1(c*mult);protein=r1(p*mult);
  }else{
    const mult=(gew*anzahl)/100;
    kcal=r1(k*mult);fett=r1(f*mult);kh=r1(c*mult);protein=r1(p*mult);
  }
  const entry={name,menge:r1(anzahl),einheit:ein,kcal,fett,kh,protein};
  if(saveDB){
    try{
      const rec=await pb.collection('foods').create({kat:'Sonstiges',name,quelle:'',einheit:ein,gew,k,f,c,p});
      S.foods.push({id:rec.id,kat:'Sonstiges',name,quelle:'',einheit:ein,gew,k,f,c,p});
    }catch(e){console.error('Food-Speicher-Fehler:',e);}
  }
  addToDay(entry);
  closeAdd();
}

async function addToDay(entry){
  if(!S.days[activeDay]) S.days[activeDay]={items:[],ziel:null,gewicht:null,_daysPbId:null};
  try{
    const record=await pb.collection('meals').create({
      name:entry.name,date:activeDay,menge:entry.menge,
      einheit:entry.einheit,kcal:entry.kcal,fett:entry.fett,
      kh:entry.kh,protein:entry.protein,
    });
    entry._pbId=record.id;
  }catch(e){console.error('PocketBase-Fehler beim Hinzufügen:',e);}
  S.days[activeDay].items.push(entry);
  if(S.activeTab==='erfassen') render();
}

function saveWeight(val){
  if(!S.days[activeDay]) S.days[activeDay]={items:[],ziel:null,gewicht:null,_daysPbId:null};
  const g=parseFloat(val);
  if(g>0) S.days[activeDay].gewicht=g;
  else S.days[activeDay].gewicht=null;
  saveDayMeta(activeDay);
}

function getAllWeights(){
  const r={};
  Object.entries(S.days).forEach(([d,day])=>{if(day.gewicht) r[d]=day.gewicht;});
  return r;
}

async function delItem(date,idx){
  if(!S.days[date]) return;
  const item=S.days[date].items[idx];
  if(item?._pbId){
    try{
      await pb.collection('meals').delete(item._pbId);
    }catch(e){
      console.error('PocketBase-Fehler beim Löschen:',e);
    }
  }
  S.days[date].items.splice(idx,1);
  render();
}

function toggleNewKat(val){
  const inp=document.getElementById('ef-kat-new');
  if(inp) inp.style.display=val==='__new__'?'block':'none';
}
function closeEdit(){
  document.getElementById('ef-ov').classList.remove('open');
  document.getElementById('ef-sh').classList.remove('open');
}
async function saveFood(existingId){
  let kat=document.getElementById('ef-kat')?.value||'Sonstiges';
  if(kat==='__new__'||kat===''){
    kat=document.getElementById('ef-kat-new')?.value?.trim()||'Sonstiges';
    if(kat&&kat!=='Sonstiges'&&!S.customKats?.includes(kat)){
      if(!S.customKats) S.customKats=[];
      if(!S._customKatsPbIds) S._customKatsPbIds={};
      S.customKats.push(kat);
      try{const rec=await pb.collection('custom_kats').create({name:kat});S._customKatsPbIds[kat]=rec.id;}catch(e){}
    }
  }
  const foodData={
    kat,
    name:document.getElementById('ef-name')?.value?.trim()||'Unbekannt',
    quelle:document.getElementById('ef-src')?.value?.trim()||'',
    einheit:document.getElementById('ef-ein')?.value?.trim()||'Stück',
    gew:parseFloat(document.getElementById('ef-gew')?.value)||100,
    k:parseFloat(document.getElementById('ef-k')?.value)||0,
    f:parseFloat(document.getElementById('ef-f')?.value)||0,
    c:parseFloat(document.getElementById('ef-c')?.value)||0,
    p:parseFloat(document.getElementById('ef-p')?.value)||0,
  };
  try{
    if(existingId){
      await pb.collection('foods').update(existingId,foodData);
      const i=S.foods.findIndex(f=>f.id===existingId);
      if(i>=0) S.foods[i]={...foodData,id:existingId};
      else S.foods.push({...foodData,id:existingId});
    }else{
      const rec=await pb.collection('foods').create(foodData);
      S.foods.push({...foodData,id:rec.id});
    }
  }catch(e){console.error('Food-Speicher-Fehler:',e);}
  closeEdit();render();
}

// ===================== MIGRATION =====================
async function migrateFromLocalStorage(){
  const raw=localStorage.getItem('nutrilog_v1');
  if(!raw){alert('Keine lokalen Daten gefunden.');return;}
  if(!confirm('Lokale Daten in PocketBase übertragen?\n\nBestehende PocketBase-Daten werden NICHT überschrieben.\nNach der Migration werden die lokalen Daten gelöscht.')) return;
  let count=0;
  try{
    const data=JSON.parse(raw);

    // Foods
    if(data.foods?.length){
      for(const f of data.foods){
        if(!S.foods.find(x=>x.name===f.name&&x.kat===f.kat)){
          const{id:_,...fd}=f;
          try{const rec=await pb.collection('foods').create(fd);S.foods.push({...fd,id:rec.id});count++;}catch(e){}
        }
      }
    }

    // History
    if(data.history){
      for(const [date,h] of Object.entries(data.history)){
        if(!S.history[date]){
          try{
            const rec=await pb.collection('history').create({date,kcal:h.kcal||0,fett:h.fett||0,kh:h.kh||0,protein:h.protein||0});
            S.history[date]={_pbId:rec.id,kcal:h.kcal||0,fett:h.fett||0,kh:h.kh||0,protein:h.protein||0};
            count++;
          }catch(e){}
        }
      }
    }

    // Days (Mahlzeiten + Gewicht/Ziel)
    if(data.days){
      for(const [date,day] of Object.entries(data.days)){
        if(day.items?.length){
          for(const item of day.items){
            try{
              const rec=await pb.collection('meals').create({...item,date});
              if(!S.days[date]) S.days[date]={items:[],ziel:null,gewicht:null};
              S.days[date].items.push({...item,_pbId:rec.id});count++;
            }catch(e){}
          }
        }
        if((day.ziel||day.gewicht)&&!S.days[date]?._daysPbId){
          try{
            const rec=await pb.collection('days').create({date,ziel:day.ziel||null,gewicht:day.gewicht||null});
            if(!S.days[date]) S.days[date]={items:[],ziel:null,gewicht:null};
            S.days[date].ziel=day.ziel||null;
            S.days[date].gewicht=day.gewicht||null;
            S.days[date]._daysPbId=rec.id;
          }catch(e){}
        }
      }
    }

    // Settings
    if(data.settings&&S._settingsPbId){
      Object.assign(S.settings,data.settings);
      await save();
    }

    // Custom Kats
    if(data.customKats?.length){
      for(const name of data.customKats){
        if(!S.customKats.includes(name)){
          try{
            const rec=await pb.collection('custom_kats').create({name});
            S.customKats.push(name);
            S._customKatsPbIds[name]=rec.id;
          }catch(e){}
        }
      }
    }

    localStorage.removeItem('nutrilog_v1');
    render();
    alert(`Migration abgeschlossen! ${count} Einträge übertragen.\nLokale Daten wurden gelöscht.`);
  }catch(e){
    alert('Migration fehlgeschlagen: '+e.message);
  }
}
