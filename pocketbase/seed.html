  const pb=new PocketBase(url);

  log('Verbinde mit '+url+' …');

  // ── FOODS ──────────────────────────────────────────
  log('<b>Lebensmittel:</b>');
  let existingFoods;
  try{
    existingFoods=await pb.collection('foods').getFullList({fields:'name,kat'});
  }catch(e){log('❌ Fehler beim Laden der foods-Collection: '+e.message,'err');btn.disabled=false;return;}

  const existingSet=new Set(existingFoods.map(f=>f.name+'||'+f.kat));
  let foodOk=0, foodSkip=0, foodErr=0;
  const total=DEFAULT_FOODS.length+HISTORY_SEED.length;
  let done=0;

  for(const food of DEFAULT_FOODS){
    const key=food.name+'||'+food.kat;
    if(existingSet.has(key)){
      foodSkip++;
    }else{
      try{
        await pb.collection('foods').create(food);
        foodOk++;
        log(`✓ ${food.name}`,'ok');
      }catch(e){
        foodErr++;
        log(`✗ ${food.name}: ${e.message}`,'err');
      }
    }
    done++;
    setProgress(done,total);
  }
  log(`Foods: ${foodOk} hochgeladen, ${foodSkip} übersprungen, ${foodErr} Fehler`);

  // ── HISTORY ────────────────────────────────────────
  log('<b>History:</b>');
  let existingHist;
  try{
    existingHist=await pb.collection('history').getFullList({fields:'date'});
  }catch(e){log('❌ Fehler beim Laden der history-Collection: '+e.message,'err');btn.disabled=false;return;}

  const existingDates=new Set(existingHist.map(r=>r.date));
  let histOk=0, histSkip=0, histErr=0;

  for(const [s,k,f,c,p] of HISTORY_SEED){
    const date=excelToISO(s);
    if(existingDates.has(date)){
      histSkip++;
    }else{
      try{
        await pb.collection('history').create({date,kcal:k,fett:f,kh:c,protein:p});
        histOk++;
      }catch(e){
        histErr++;
        log(`✗ ${date}: ${e.message}`,'err');
      }
    }
    done++;
    setProgress(done,total);
  }
  log(`History: ${histOk} hochgeladen, ${histSkip} übersprungen, ${histErr} Fehler`);

  log('──────────────────────────────────');
  log(`✅ Fertig! Foods: ${foodOk+foodSkip}/${DEFAULT_FOODS.length} · History: ${histOk+histSkip}/${HISTORY_SEED.length}`,'ok');
  btn.disabled=false;
}
</script>
</body>
</html>
